<header class="hero">


<h1>
Backup 💾
</h1>


<p>
Save your Relax data or restore it later.
</p>


</header>








<main>




<section class="welcome-card">


<h2>
Export Your Data
</h2>



<p>

Create a backup file containing your Relax information.

</p>




<button id="exportData">

Export Backup

</button>



</section>








<section class="welcome-card">


<h2>
Restore Data
</h2>



<p>

Import a previous Relax backup file.

</p>



<button id="chooseFile">

Choose Backup File

</button>



<input 

type="file"

id="backupFile"

accept=".json"

hidden>



</section>





</main>
