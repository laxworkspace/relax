<header class="hero">


<h1>
Daily Planner 📅
</h1>


<p>
Plan your day without feeling overwhelmed.
</p>


</header>






<main>



<section class="welcome-card">


<h2>
Work / Study
</h2>



<input 
id="workInput"
placeholder="Add a work or study task...">



<button id="addWork">

Add Task

</button>



<div id="workList">

</div>


</section>








<section class="welcome-card">


<h2>
Personal Tasks
</h2>



<input 
id="personalInput"
placeholder="Add personal tasks...">



<button id="addPersonal">

Add Task

</button>



<div id="personalList">

</div>



</section>








<section class="welcome-card">


<h2>
Today's Progress</h2>


<p id="plannerProgress">

0 completed tasks

</p>



</section>



</main>
