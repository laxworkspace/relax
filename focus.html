<header class="hero">

<h1>
Focus Room ⏳
</h1>

<p>
Work with your brain, not against it.
</p>

</header>





<main>



<section class="welcome-card">


<h2>
Daily Focus Goal
</h2>


<input 
type="number"
id="dailyGoal"
placeholder="Minutes per day">



<button id="saveGoal">

Save Goal

</button>


</section>








<section class="welcome-card">


<h2>
Timer
</h2>



<div id="timer">

25:00

</div>




<div>


<button id="startTimer">

Start

</button>



<button id="pauseTimer">

Pause

</button>



<button id="resetTimer">

Reset

</button>


</div>



</section>









<section class="welcome-card">


<h2>
Progress
</h2>



<p id="focusStats">

0 minutes focused

</p>



<p id="focusStreak">

0 day streak

</p>



</section>



</main>
